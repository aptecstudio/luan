# meta-luan — user space shared by all platforms (D-012, D-014)

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "luan"
BBFILE_PATTERN_luan = "^${LAYERDIR}/"
BBFILE_PRIORITY_luan = "10"

LAYERVERSION_luan = "1"
LAYERDEPENDS_luan = "core"
LAYERSERIES_COMPAT_luan = "wrynose"
