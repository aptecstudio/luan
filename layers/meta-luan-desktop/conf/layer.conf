# meta-luan-desktop — desktop amd64 hardware layer (D-014)

BBPATH .= ":${LAYERDIR}"
# Path of this layer, for files that tasks must track (e.g. the boot menu, machine
# configuration). ":=" because LAYERDIR is set only while this file is read.
LUAN_DESKTOP_LAYERDIR := "${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "luan-desktop"
BBFILE_PATTERN_luan-desktop = "^${LAYERDIR}/"
BBFILE_PRIORITY_luan-desktop = "11"
# The layer may contain only bbappends and machine configuration
BBFILE_PATTERN_IGNORE_EMPTY_luan-desktop = "1"

LAYERVERSION_luan-desktop = "1"
LAYERDEPENDS_luan-desktop = "core luan"
LAYERSERIES_COMPAT_luan-desktop = "wrynose"
