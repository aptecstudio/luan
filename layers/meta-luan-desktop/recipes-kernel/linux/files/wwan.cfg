# Luán desktop — mobile broadband and phone tethering (D-061). The user-space
# side is ModemManager with NetworkManager.
# USB modems and USB sticks: network over MBIM, QMI or NCM, control over the
# cdc-wdm device or serial AT ports
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDC_MBIM=m
CONFIG_USB_NET_QMI_WWAN=m
CONFIG_USB_WDM=m
CONFIG_USB_ACM=m
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_OPTION=m
CONFIG_USB_SERIAL_QUALCOMM=m
# Modems built into laptops on PCIe (M.2): Qualcomm through MHI, Intel XMM7360 (IOSM),
# MediaTek T7xx (Fibocom FM350 and similar)
CONFIG_WWAN=m
CONFIG_MHI_BUS=m
CONFIG_MHI_BUS_PCI_GENERIC=m
CONFIG_MHI_WWAN_CTRL=m
CONFIG_MHI_WWAN_MBIM=m
CONFIG_IOSM=m
CONFIG_MTK_T7XX=m
# Internet shared by a phone over USB: Android (RNDIS on older phones, NCM above) and
# iPhone
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_IPHETH=m
