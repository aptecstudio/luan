# Luán — boot menu (D-009, D-026, D-047, D-048, D-058, D-060)
#
# Chooses which copy of the system to boot (slot A or B), following RAUC's rules:
# - boot the first slot in ORDER that is valid (X_OK) and not given up (X_TRY);
# - every slot has 3 attempts (X_LEFT counts the ones left); the last one sets X_TRY=1;
# - when the system starts fine, rauc-mark-good clears X_TRY and the
#   luan-boot-attempts hook puts X_LEFT back to 3;
# - after 3 boots that did not complete, the other slot is used.
# Three attempts, not one: a PC switched off at the password prompt of the data
# partition (step 4d) must not fall back to the previous version; a corrupted slot
# still does, after 3 restarts (D-047). Like systemd-boot's boot counting.
# RAUC updates OK, TRY and ORDER in grubenv when it installs an update; X_LEFT is ours
# (empty or 0 with X_TRY=0, as after an installation, counts as 3).
# Values are 1 and 0, as RAUC writes them (not true/false: with those, after the first
# update no slot was bootable and the menu stopped waiting).
#
# GRUB reads only the EFI partition, never the system slots (D-048). The boot files of
# each slot are in /EFI/luan/A and /EFI/luan/B, written with the slot (by
# the disk image for A, by the update bundle's hook for the slot it installs):
#   luan.efi   unified kernel image (UKI), started on UEFI with the profile of
#                    the slot (@0 for A, @1 for B): kernel, microcode, initramfs and
#                    command line, with the dm-verity root hash of the slot, are inside
#   bzImage, microcode.cpio, initramfs.cpio.zst, boot.env
#                    the same, as separate files, for the PC that boots from BIOS
#                    (D-059); boot.env holds the two command lines

set timeout=5
set timeout_style=menu

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_LEFT=3
set B_LEFT=3
load_env

set slots=/EFI/luan

# Command line of each slot, from its own boot.env: only the name listed is read from
# the file, so it can set nothing else (cmdline_a from A's file, cmdline_b from B's)
set A_CMDLINE=""
set B_CMDLINE=""
if [ -f "$slots/A/boot.env" ]; then
    set cmdline_a=""
    load_env --file "$slots/A/boot.env" cmdline_a
    set A_CMDLINE="$cmdline_a"
fi
if [ -f "$slots/B/boot.env" ]; then
    set cmdline_b=""
    load_env --file "$slots/B/boot.env" cmdline_b
    set B_CMDLINE="$cmdline_b"
fi
unset cmdline_a
unset cmdline_b

# A slot without its boot files cannot be started (or verified), so it is never chosen
set chosen=""
for SLOT in $ORDER; do
    if [ -z "$chosen" ]; then
        if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" -a -n "$A_CMDLINE" ]; then
            set chosen=A
            if [ "$A_LEFT" = "2" ]; then
                set A_LEFT=1
            elif [ "$A_LEFT" = "1" ]; then
                set A_LEFT=0
                set A_TRY=1
            else
                set A_LEFT=2
            fi
        fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" -a -n "$B_CMDLINE" ]; then
            set chosen=B
            if [ "$B_LEFT" = "2" ]; then
                set B_LEFT=1
            elif [ "$B_LEFT" = "1" ]; then
                set B_LEFT=0
                set B_TRY=1
            else
                set B_LEFT=2
            fi
        fi
    fi
done
save_env A_TRY B_TRY A_LEFT B_LEFT

if [ "$chosen" = "B" ]; then
    set default=slot_b
    set title_a="Luán (previous version)"
    set title_b="Luán"
elif [ "$chosen" = "A" ]; then
    set default=slot_a
    set title_a="Luán"
    set title_b="Luán (previous version)"
else
    # No slot bootable automatically: show the menu without a countdown
    set timeout=-1
    set title_a="Luán (copy A)"
    set title_b="Luán (copy B)"
fi

# Graphical theme with its fonts (luan-grub-theme, D-060): if missing, text menu.
# The fonts are listed by name: GRUB expands "*" only with the regexp module, which is
# not built in.
set theme_dir="$prefix/themes/luan"
if [ -f "$theme_dir/theme.txt" ]; then
    loadfont "$theme_dir/inter-regular-14.pf2"
    loadfont "$theme_dir/inter-regular-18.pf2"
    loadfont "$theme_dir/inter-medium-18.pf2"
    loadfont "$theme_dir/inter-semibold-28.pf2"
    # Video modes from the firmware only (efi_gop on UEFI, vbe on BIOS), all built in
    set gfxmode=auto
    terminal_output gfxterm
    set theme="$theme_dir/theme.txt"
fi

# On UEFI the UKI is started with the slot's profile: the command line inside it is
# used, any other argument is ignored (and with Secure Boot, in Phase 8, it is signed).
# From BIOS (D-059) GRUB loads the separate files with the line from boot.env.
if [ "$A_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_a" --id=slot_a {
        if [ "$grub_platform" = "efi" ]; then
            chainloader $slots/A/luan.efi @0
        else
            linux $slots/A/bzImage $A_CMDLINE
            initrd $slots/A/microcode.cpio $slots/A/initramfs.cpio.zst
        fi
    }
fi
if [ "$B_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_b" --id=slot_b {
        if [ "$grub_platform" = "efi" ]; then
            chainloader $slots/B/luan.efi @1
        else
            linux $slots/B/bzImage $B_CMDLINE
            initrd $slots/B/microcode.cpio $slots/B/initramfs.cpio.zst
        fi
    }
fi

# Other systems on the PC (D-060): at every boot GRUB looks for the boot loader of each
# known system on the partitions it can read, so a system installed later shows up with
# nothing to update. Only FAT is built in: GRUB reads the EFI partitions of other
# systems, never their own file systems. UEFI only; from BIOS, the other systems start
# from the firmware's boot menu.
# other_system LOADER TITLE ID: "(*)" expands (regexp module) to every partition that
# has LOADER, nothing else; the first one gets a menu entry that chainloads it.
# Partition and path are passed to the entry as arguments ($1 in the entry is the
# title): the entry makes the partition the root device, because the chainloader tells
# the started loader that it comes from the root device, and Windows looks for its boot
# configuration there. Not "search --file": every loader it does not find prints an
# error on the screen.
function other_system {
    for loader in (*)$1; do
        if [ -f "$loader" ]; then
            regexp --set=1:other_device --set=2:other_path '^\((.*)\)(/.*)$' "$loader"
            menuentry "$2" "$other_device" "$other_path" --id="$3" {
                set root="$2"
                chainloader "$3"
            }
            break
        fi
    done
}

if [ "$grub_platform" = "efi" ]; then
    other_system /EFI/Microsoft/Boot/bootmgfw.efi "Windows" windows
    other_system /EFI/ubuntu/shimx64.efi "Ubuntu" ubuntu
    other_system /EFI/debian/shimx64.efi "Debian" debian
    other_system /EFI/fedora/shimx64.efi "Fedora" fedora
    other_system /EFI/opensuse/shim.efi "openSUSE" opensuse
    other_system /EFI/systemd/systemd-bootx64.efi "Linux (systemd-boot)" systemd_boot
    other_system /EFI/GRUB/grubx64.efi "Linux (GRUB)" linux_grub
    unset loader
    unset other_device
    unset other_path

    menuentry "UEFI Firmware Settings" --id=fwsetup {
        fwsetup
    }
fi
