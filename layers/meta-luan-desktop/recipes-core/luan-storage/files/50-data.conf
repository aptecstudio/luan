# Luán — data partition, created by systemd-repart on first boot (D-026)
# Takes all the free disk space after the system slots.
#
# LUKS2 encryption with an EMPTY key: the data is NOT protected until
# "luan-data-key setup" sets the password and the recovery key and removes the
# empty key (step 4d, D-058). The setup of Phase 8 will do the same on installation,
# and add the TPM where present.

[Partition]
Type=var
Label=data
Format=ext4
Encrypt=key-file
SizeMinBytes=2G
FactoryReset=no
