# project-os — distribution configuration (shared by desktop and mobile)

DISTRO = "project-os"
DISTRO_NAME = "project-os"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "phase1"
MAINTAINER = "project-os <https://github.com/aptecstudio/project-os>"

TARGET_VENDOR = "-projectos"
SDK_VENDOR = "-projectossdk"

# C library and init (D-015, D-016)
TCLIBC = "glibc"
INIT_MANAGER = "systemd"

# Distribution features. Yocto 6.0 starts from DISTRO_FEATURES_DEFAULTS and removes the
# ones listed here; each exclusion has its reason (AGENTS.md §5.5).
#   x11           Wayland only (R-03)
#   pulseaudio    audio goes through PipeWire
#   nfs           not needed on desktop and phone
#   zeroconf      no Avahi by default: an unneeded listening network service
#   3g nfc        to be re-enabled in the mobile layer, if and where needed
#   ptest         package tests: they do not go into the image
#   multiarch     no 32-bit libraries
#   debuginfod    no debug-symbol requests to the network
#   gobject-introspection-data
#                 bindings of GLib-based libraries for other languages (Python, JS):
#                 nothing uses them (apps are in Luau, D-049), and making them runs
#                 every library under emulation during the build (D-061)
DISTRO_FEATURES_OPTED_OUT = "\
    x11 pulseaudio nfs zeroconf 3g nfc ptest multiarch debuginfod \
    gobject-introspection-data \
"

# Additions: authentication (logind, polkit), USB peripherals, A/B updates (D-026)
DISTRO_FEATURES:append = " pam usbhost rauc"

# No syslog daemon: systemd-journald is the system log; BusyBox's syslogd would only
# duplicate it (R-02)
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Hardened compiler options (stack protector, FORTIFY_SOURCE, PIE, relro): in Yocto 6.0
# defaultsetup.conf already includes them (security_flags.inc), no need to repeat it.

# Packages only as an internal build format: the image has no package manager, the
# system is updated through A/B images (D-018)
PACKAGE_CLASSES ?= "package_ipk"

# Languages: Italian and English locales for the users of the system
GLIBC_GENERATE_LOCALES = "it_IT.UTF-8 en_US.UTF-8"
IMAGE_LINGUAS = "it-it en-us"

hostname:pn-base-files = "project-os"

# Hardware services (D-061): only the parts that are used, each recipe's defaults pull
# in much more (AGENTS.md §5.5).
# Network: NetworkManager, the same API on desktop and on the Halium-based phones, with
# wpa_supplicant for Wi-Fi and ModemManager for mobile broadband. systemd-networkd off:
# two network managers on the same interfaces would fight over them.
PACKAGECONFIG:remove:pn-systemd = "networkd"
#   gnutls     certificates of enterprise Wi-Fi and VPNs (smaller than nss)
#   readline   line editing for nmcli (development tool)
#   no polkit: only root (and later the broker, D-005) may change the network
#   no dnsmasq, ppp, ifupdown, Bluetooth tethering (DUN): not used yet
PACKAGECONFIG:pn-networkmanager = "systemd wifi wwan modemmanager gnutls nmcli readline"
# Mobile broadband: MBIM and QMI modems (almost all of them), no vala bindings
PACKAGECONFIG:pn-modemmanager = "mbim qmi systemd"
# Bluetooth: no OBEX file transfer, PAN networking or deprecated tools (hciconfig…)
PACKAGECONFIG:remove:pn-bluez5 = "obex-profiles network-profiles deprecated"
# Audio: PipeWire with WirePlumber, per user (no system-wide service), ALSA devices,
# Bluetooth audio (SBC codec; AAC needs a commercial license), ALSA programs routed to
# PipeWire. No GStreamer, JACK, camera, Vulkan, Avahi, Flatpak, FFmpeg: not used yet.
# The recipe sets its defaults with the class-target override, which wins over a
# pn-pipewire assignment: so the unused options are removed, and the ALSA plugin added.
PACKAGECONFIG:remove:pn-pipewire = "\
    avahi bluez-aac bluez-aptx bluez-opus ffmpeg flatpak gsettings gstreamer jack \
    libcamera libusb ncurses pulseaudio pw-cat raop readline sndfile \
    systemd-system-service v4l2 volume vulkan webrtc-echo-cancelling \
"
PACKAGECONFIG:append:pn-pipewire = " pipewire-alsa"
PACKAGECONFIG:remove:pn-wireplumber = "systemd-system-service"
